name: Checks

# The excerpts on /process are copies of text from files in this repo, and a
# copy can drift from its source. This fails the build when one no longer
# matches. The script uses only Node built-ins, so no pnpm install is needed.
# Likewise the root README's template table is a copy of the site's template
# list; the second job fails when they disagree. And the Code tab links to files
# in the templates as evidence; the third job fails when one goes missing. And
# a tiged fork gets only its package folder, so each template carries its own
# LICENSE; the fourth job fails when a copy goes missing or differs from the root.
# And a template only reaches the live site if it is in the sync script and in
# deploy.yml's build and copy steps; the fifth job fails when one is missing.
# Finally the template packages and the site have their own test suites, which
# nothing else here runs; the sixth job runs them, so a change cannot break or
# weaken a test and still show a green check.
# The seventh job is what a fork actually does: copy one template out alone and
# run plain `npm install` on Node 20 (npm 10), which the pnpm lockfile above
# never exercises. It would have caught the vitest range that crashed npm 10.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  process-excerpts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/check-process-excerpts.test.mjs

      - run: node scripts/check-process-excerpts.mjs

  templates-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/check-templates-readme.test.mjs

      - run: node scripts/check-templates-readme.mjs

  code-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/check-code-tab.test.mjs

      - run: node scripts/check-code-tab.mjs

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/check-license.test.mjs

      - run: node scripts/check-license.mjs

  template-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/check-template-builds.test.mjs

      - run: node scripts/check-template-builds.mjs

  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One package at a time: run together, the three Vitest processes compete
      # for the runner's CPU and the first cold import of a lazy page plus
      # recharts in the monitoring tests could outlast its timeout (seen locally
      # with `pnpm -r run test`). Serial takes about 35 seconds.
      - run: pnpm -r --workspace-concurrency=1 run test

  fork-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Add new forkable templates (with their own LICENSE and README) here.
        # The site is excluded on purpose: it is not a forkable template.
        template: [monitoring, agent-panel, landing]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Node 20 bundles npm 10, which is what a forker is most likely to have.
      # The template is copied out of the workspace, so nothing here can fall
      # back on the repo's pnpm-lock.yaml or node_modules.
      - name: Copy ${{ matrix.template }} out on its own
        run: |
          mkdir "$RUNNER_TEMP/fork"
          cp -r "packages/${{ matrix.template }}/." "$RUNNER_TEMP/fork/"

      - run: npm --version && npm install
        working-directory: ${{ runner.temp }}/fork

      - run: npm run build
        working-directory: ${{ runner.temp }}/fork

      - run: npm test
        working-directory: ${{ runner.temp }}/fork
